    <!-- Schema.org Restaurant Structured Data (JSON-LD) -->

    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Foogle",
      "description": "Contemporary cafe and restaurant in Panchwati, Udaipur, offering handcrafted pizzas, pastas, desserts, and specialty coffee.",

        "@type": "PostalAddress",

        "addressRegion": "Rajasthan",
        "addressCountry": "IN"
      },
      "hasMap": "https://www.google.com/maps/search/?api=1&query=Foogle+Cafe+Panchwati+Udaipur"
    }
    </script>

    <!-- Anti-flash inline theme loader -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('foogle-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
